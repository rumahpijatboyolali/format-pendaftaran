<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumah Pijat Boyolali</title>
<style>
body{margin:0;background:#160f0b;font-family:Arial,sans-serif;color:#333}
.wrap{max-width:480px;margin:auto;padding:18px}
.card{background:#fff8ed;border-radius:24px;padding:22px;box-shadow:0 8px 30px #0007}
.logo{width:170px;height:auto;display:block;margin:0 auto 10px}
h1{text-align:center;color:#9b6b25;font-size:24px}
.tag{text-align:center;font-style:italic;margin-bottom:15px}
button{cursor:pointer}
.music{width:100%;padding:12px;border:0;border-radius:12px;background:#b78632;color:white;font-weight:bold;margin-bottom:20px}
input,textarea,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-bottom:14px;box-sizing:border-box;font-size:15px}
textarea{height:90px}
.location{display:flex;gap:8px}
.location input{flex:1}
.locbtn{background:#8c642c;color:white;border:0;border-radius:12px;padding:0 12px}
.submit{width:100%;padding:15px;background:#25d366;color:white;border:0;border-radius:14px;font-size:17px;font-weight:bold}
.note{margin-top:20px;background:#f2d18a;border-radius:18px;padding:18px;text-align:center}
.note strong{font-size:28px;color:#7b4d00}
.social{text-align:center;margin-top:20px}
.social a{color:#8c642c;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<div class="card">

<img src="logo.png" class="logo">

<div class="tag">"Relax, Healthy and Happy"</div>

<button class="music" onclick="playMusic()">🎵 Putar Suasana Relax</button>
<audio id="music" loop>
<source src="rpb1.mp3" type="audio/mpeg">
</audio>

<form id="form">
<input id="nama" placeholder="Nama *" required>
<input id="usia" placeholder="Usia *" required>
<textarea id="alamat" placeholder="Alamat *" required></textarea>

<select id="treatment" required>
<option value="">Pilih Treatment *</option>
<option>Pijat Capek</option>
<option>Pijat Keluhan</option>
</select>

<input id="tanggal" type="datetime-local" required>

<input id="instagram" placeholder="Instagram">

<select id="jenis" required>
<option value="">Homecare / Ke Outlet *</option>
<option>Homecare</option>
<option>Ke Outlet</option>
</select>

<div class="location">
<input id="lokasi" placeholder="Share Location" readonly>
<button type="button" class="locbtn" onclick="ambilLokasi()">📍</button>
</div>

<input id="wa" placeholder="No WhatsApp *" required>

<button class="submit">💬 Kirim Pendaftaran</button>
</form>

<div class="note">
✨ PROMO PIJAT ✨<br>
<strong>100K</strong><br>
⏱ Durasi ± 2 Jam<br>
Tergantung kondisi tubuh
</div>

<div class="social">
📸 <a href="https://www.instagram.com/rumahpijatboyolali" target="_blank">Instagram</a><br><br>
🎵 <a href="https://www.tiktok.com/@rumahpijatboyolali" target="_blank">TikTok</a>
</div>

</div>
</div>

<script>
function playMusic(){
 document.getElementById("music").play();
}

function ambilLokasi(){
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(p){
   lokasi.value="https://maps.google.com/?q="+p.coords.latitude+","+p.coords.longitude;
  });
 }else alert("Lokasi tidak tersedia");
}

form.onsubmit=function(e){
e.preventDefault();

let pesan=`*FORMAT PENDAFTARAN ONLINE*
Rumah_Pijat_Boyolali

Nama                     : ${nama.value}
Usia                       : ${usia.value}
Alamat                   : ${alamat.value}
Treatment              : ${treatment.value}
Tanggal/Jam          : ${tanggal.value}
Instagram              : ${instagram.value || "-"}
Homecare/keoutlet : ${jenis.value}
Sharelocation        : ${lokasi.value || "-"}
No WA                    : ${wa.value}

*"Relax, Healthy and Happy"*
*"HAPYY MASSAGE"*

note:
Tarif 100k untuk durasi pijat +-2jam tergantung kondisi

IG @rumahpijatboyolali
TikTok @rumahpijatboyolali`;

window.open("https://wa.me/6285134481399?text="+encodeURIComponent(pesan));
}
</script>
</body>
</html>

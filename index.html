<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reservasi Rumah Pijat Boyolali</title>
  <style>
    :root{color-scheme:light;--brown:#17100b;--gold:#b8893d;--cream:#fff8ed;--ink:#38291c;--line:#ddd8d2;--muted:#8b8177;--green:#25d366}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--brown)}
    body{margin:0;min-height:100vh;padding:16px;background:var(--brown);font-family:Arial,system-ui,sans-serif;color:var(--ink)}
    button,.locbtn,.maps-open,.admin-link{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .14s ease,filter .14s ease,box-shadow .14s ease}
    button:active,.locbtn:active,.maps-open:active,.admin-link:active{transform:scale(.97);filter:brightness(.92)}
    button:focus-visible,.locbtn:focus-visible,.maps-open:focus-visible,.admin-link:focus-visible{outline:3px solid #d39a43;outline-offset:3px}
    .is-clicked{animation:click-feedback .38s ease-out}
    @keyframes click-feedback{0%{transform:scale(1)}40%{transform:scale(.95);filter:brightness(.88)}100%{transform:scale(1);filter:brightness(1)}}
    .container{width:100%;max-width:480px;margin:0 auto}
    .back-link{display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;padding:8px 12px;border:1px solid #d8c5a8;border-radius:10px;color:#71522e;background:#fffdf8;text-decoration:none;font-size:13px;font-weight:700}
    .back-link:hover{background:#f3eadb}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .card{padding:20px 16px 22px;background:var(--cream);border-radius:22px;box-shadow:0 10px 30px #0005}
    .logo{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 12px}
    h1{margin:0;text-align:center;color:#9b6b25;font-size:clamp(22px,6vw,28px);line-height:1.2}
    .tag{margin:12px 0 0;text-align:center;font-size:13px;font-style:italic}
    .music{width:100%;margin:15px 0 12px;padding:11px;border:0;border-radius:10px;background:var(--gold);color:#fff;font-weight:700}
    form{display:grid;gap:9px}
    input,textarea,select{width:100%;min-width:0;min-height:44px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#38291c;font:inherit;font-size:14px}
    input:focus,textarea:focus,select:focus{outline:2px solid #b8893d55;border-color:var(--gold)}
    textarea{min-height:76px;resize:vertical}
    .location{display:flex;gap:7px;align-items:flex-start}
    .location input{flex:1}
    .locbtn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 46px;height:44px;border:0;border-radius:10px;background:#9b702c;color:#fff;font-size:20px;text-decoration:none;cursor:pointer}
    .locbtn:active{transform:scale(.88);background:#76521d;box-shadow:0 0 0 4px #b8893d55}
    .locbtn.is-loading{animation:location-pulse .8s ease-in-out infinite alternate}
    @keyframes location-pulse{to{transform:scale(.9);box-shadow:0 0 0 5px #b8893d55}}
    .location-help{margin:-3px 2px 2px;color:var(--muted);font-size:11px;line-height:1.4}
    .maps-open{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border-radius:9px;background:#f0e4d1;color:#71522e;text-decoration:none;font-size:12px}
    .location-status{display:none;margin:-3px 2px 2px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.4}
    .location-status.visible{display:block;background:#e5f5e8;color:#286343}
    .location-status.error{display:block;background:#fde8e5;color:#a52e28}
    .submit{width:100%;min-height:48px;margin-top:2px;border:0;border-radius:11px;background:var(--green);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
    .submit:disabled{opacity:.65;cursor:wait}
    .status{display:none;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
    .status.error{display:block;background:#fde8e5;color:#a52e28}
    .status.success{display:block;background:#e5f5e8;color:#286343}
    .note{margin-top:14px;padding:13px 10px;border-radius:15px;background:#f3d48d;text-align:center;color:#24180d;font-size:13px;line-height:1.55}
    .note strong{display:block;color:#7b4d00;font-size:24px;line-height:1.2}
    .social{margin-top:15px;text-align:center;font-size:13px;line-height:1.8}
    a{color:#9b702c;font-weight:700}
    .admin-link{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;padding:9px 14px;border:1px solid #d8c5a8;border-radius:10px;color:#71522e;text-decoration:none;font-size:12px;font-weight:700}
    .admin-link:hover{background:#f3eadb}
    @media(prefers-reduced-motion:reduce){button,.locbtn,.maps-open,.admin-link{transition:none}.is-clicked,.locbtn.is-loading{animation:none}}
    @media(max-width:360px){body{padding:10px}.card{padding:17px 13px;border-radius:18px}.logo{width:96px;height:96px}}
  </style>
</head>
<body>
  <main class="container">
    <section class="card" aria-labelledby="brandTitle">
      <a class="back-link" href="https://rumahpijatboyolali.github.io/format-pendaftaran/landing-rumah-pijat-boyolali.html" aria-label="Kembali ke halaman landing"><span aria-hidden="true">←</span> Kembali</a>
      <img class="logo" src="https://rumahpijatboyolali.github.io/format-pendaftaran/logo.png" alt="Logo Rumah Pijat Boyolali">
      <h1 id="brandTitle">Rumah Pijat Boyolali</h1>
      <p class="tag">"Relax, Healthy and Happy"</p>

      <button class="music" id="musicBtn" type="button">🎵 Putar Suasana Relax</button>
      <audio id="music" loop preload="none"><source src="https://rumahpijatboyolali.github.io/format-pendaftaran/rpb1.mp3" type="audio/mpeg"></audio>

      <form id="reservationForm" action="<?= submitUrl ?>" method="post" target="_top">
        <input id="nama" name="nama" type="text" placeholder="Nama *" autocomplete="name" maxlength="120" required>
        <input id="usia" name="usia" type="number" placeholder="Usia *" min="1" max="120" required>
        <textarea id="alamat" name="alamat" placeholder="Alamat *" autocomplete="street-address" required></textarea>
        <select id="treatment" name="treatment" required>

        </select>
        <label class="sr-only" for="tanggal">Tanggal reservasi</label>
        <input id="tanggal" name="tanggal" type="date" required>
        <select id="jam" name="jam" required aria-label="Pilih jam reservasi">
          <option value="">Pilih Jam *</option>
          <option value="08:00">08:00</option>

          <option value="17:00">17:00</option>

          <option value="19:00">19:00</option>

          <option value="20:00">20:00</option>

          <option value="21:00">21:00</option>
          </select>
        <input id="instagram" name="instagram" type="text" placeholder="Instagram">
        <select id="jenis" name="jenis" required>
          <option value="">Homecare / Ke Outlet *</option>
          <option value="Homecare">Homecare</option>
          <option value="Ke Outlet">Ke Outlet</option>
        </select>
        <div class="location">
          <input id="lokasi" name="lokasi" type="text" placeholder="Tempel link Google Maps (opsional)" autocomplete="url" aria-label="Link lokasi Google Maps">
          <button class="locbtn" id="locationBtn" type="button" onclick="ambilLokasi()" aria-label="Ambil lokasi perangkat" title="Ambil lokasi perangkat">📍</button>
        </div>
        <small class="location-help">Tempel tautan dari Google Maps, atau tekan 📍 dan izinkan akses lokasi perangkat.</small>
        <small class="location-status" id="locationStatus" aria-live="polite"></small>
        <input id="wa" name="wa" type="tel" placeholder="No WhatsApp *" autocomplete="tel" required>

        <button class="submit" id="submitBtn" type="submit">💬 Kirim Pendaftaran</button>
      </form>

      <aside class="note">✨ PROMO PIJAT ✨<strong>100K</strong>⏱ Durasi ± 2 Jam<br>Tergantung kondisi tubuh</aside>
      <div class="social">📸 <a href="https://www.instagram.com/rumahpijatboyolali" target="_blank" rel="noopener">Instagram</a><br><br>🎵 <a href="https://www.tiktok.com/@rumahpijatboyolali" target="_blank" rel="noopener">TikTok</a></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('reservationForm');
    const dateInput = document.getElementById('tanggal');
    const timeInput = document.getElementById('jam');
    const statusBox = document.getElementById('formStatus');
    const submitButton = document.getElementById('submitBtn');
    const monthLabels = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const locationOrigin='https://rumahpijatboyolali.github.io';
    let locationWindow=null;
    let locationTimeout=null;

    function localDateValue(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    const today = localDateValue(new Date());
    dateInput.min = today;

    function setStatus(message, type) {
      statusBox.textContent=message;
      statusBox.className=`status ${type}`;
    }

    // GPS is collected by the public GitHub Pages helper because Apps Script
    // HtmlService runs in a sandbox that may deny the browser geolocation API.
    window.addEventListener('message', function(event) {
      if (event.origin !== locationOrigin) return;
      const payload=event.data;
      if (!payload || payload.type !== 'rpb-location-result') return;
      const latitude=Number(payload.latitude);
      const longitude=Number(payload.longitude);
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude) || Math.abs(latitude)>90 || Math.abs(longitude)>180) return;
      document.getElementById('lokasi').value=`https://maps.google.com/?q=${latitude},${longitude}`;
      locationWindow=null;
      window.clearTimeout(locationTimeout);
      const button=document.getElementById('locationBtn');
      button.disabled=false;
      button.textContent='📍';
      button.classList.remove('is-loading');
      button.dataset.locationBusy='false';
      const locationStatus=document.getElementById('locationStatus');
      locationStatus.textContent='Lokasi berhasil diambil dari Google Maps.';
      locationStatus.className='location-status visible';
    });

    // Give every button and button-style link a brief visual acknowledgement.
    document.addEventListener('click', function(event) {
      const control=event.target.closest('button, .locbtn, .maps-open, .admin-link');
      if (!control || control.matches(':disabled')) return;
      control.classList.remove('is-clicked');
      void control.offsetWidth;
      control.classList.add('is-clicked');
      window.setTimeout(() => control.classList.remove('is-clicked'), 420);
      if (control.id === 'locationBtn' && control.dataset.locationBusy !== 'true') ambilLokasi();
    });

    document.getElementById('musicBtn').addEventListener('click', async function() {
      const audio=document.getElementById('music');
      if (audio.paused) {
        try { await audio.play(); this.textContent='🔇 Matikan Musik'; }
        catch (_) { setStatus('Musik belum bisa diputar. Coba tekan tombol sekali lagi.', 'error'); }
      } else { audio.pause(); this.textContent='🎵 Putar Suasana Relax'; }
    });

    function ambilLokasi() {
      const button=document.getElementById('locationBtn');
      const locationStatus=document.getElementById('locationStatus');
      if (button.dataset.locationBusy === 'true') return;
      button.dataset.locationBusy='true';
      button.disabled=true;
      button.textContent='…';
      button.classList.add('is-loading');
      locationStatus.textContent='Membuka GPS sebentar. Setelah lokasi diizinkan, halaman ini kembali otomatis.';
      locationStatus.className='location-status visible';
      try {
        locationWindow=window.open('https://rumahpijatboyolali.github.io/format-pendaftaran/location.html?v=3','rpbLocationPicker','popup,width=480,height=720');
      } catch (_) { locationWindow=null; }
      if (!locationWindow) {
        locationStatus.textContent='Pop-up diblokir browser. Izinkan pop-up untuk situs ini lalu tekan 📍 lagi.';
        locationStatus.className='location-status visible error';
        button.disabled=false;
        button.textContent='📍';
        button.classList.remove('is-loading');
        button.dataset.locationBusy='false';
        return;
      }
      locationTimeout=window.setTimeout(() => {
        if (!locationWindow) return;
        locationWindow=null;
        button.disabled=false;
        button.textContent='📍';
        button.classList.remove('is-loading');
        button.dataset.locationBusy='false';
        locationStatus.textContent='Lokasi belum kembali. Pastikan akses GPS diizinkan di tab helper, lalu tekan 📍 lagi.';
        locationStatus.className='location-status visible error';
      },60000);
    }

    function buildWhatsAppMessage(data) {
      const date = new Date(`${data.tanggal}T12:00:00`);
      const tanggalLabel = `${date.getDate()} ${monthLabels[date.getMonth()]} ${date.getFullYear()}`;
      return `*FORMAT PENDAFTARAN ONLINE*\nRumah_Pijat_Boyolali\n\nNama                     : ${data.nama}\nUsia                       : ${data.usia}\nAlamat                   : ${data.alamat}\nTreatment              : ${data.treatment}\nTanggal/Jam          : ${tanggalLabel}, ${data.jam}\nInstagram              : ${data.instagram || '-'}\nHomecare/keoutlet : ${data.jenis}\nSharelocation        : ${data.lokasi || '-'}\nNo WA                    : ${data.wa}\n\n*"Relax, Healthy and Happy"*\n*"HAPYY MASSAGE"*\n\nnote:\nTarif 100k untuk durasi pijat +-2jam tergantung kondisi\n\nIG @rumahpijatboyolali\nTikTok @rumahpijatboyolali`;
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      submitReservation();
    });

    function submitReservation() {
      if (submitButton.disabled) return;
      if (!form.reportValidity()) {
        setStatus('Lengkapi semua kolom wajib: Nama, Usia, Alamat, Treatment, Tanggal, Jam, Homecare/Ke Outlet, dan No WhatsApp.', 'error');
        return;
      }
      const data={
        nama:document.getElementById('nama').value.trim(),
        usia:document.getElementById('usia').value,
        alamat:document.getElementById('alamat').value.trim(),
        treatment:document.getElementById('treatment').value,
        tanggal:dateInput.value,
        jam:timeInput.value,
        instagram:document.getElementById('instagram').value.trim(),
        jenis:document.getElementById('jenis').value,
        lokasi:document.getElementById('lokasi').value,
        wa:document.getElementById('wa').value.trim()
      };
      if (data.tanggal < today) { setStatus('Tanggal reservasi tidak boleh lewat.', 'error'); return; }
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setStatus('Form reservasi belum terhubung ke Apps Script. Muat ulang halaman atau hubungi admin.', 'error');
        return;
      }

      const whatsappTab=window.open('about:blank','_blank');
      submitButton.disabled=true;
      submitButton.textContent='Menyimpan reservasi…';
      setStatus('Menyimpan reservasi ke jadwal…', 'success');
      try {
      google.script.run
        .withSuccessHandler(result => {
          submitButton.disabled=false;
          submitButton.textContent='💬 Kirim Pendaftaran';
          if (!result || !result.success) {
            if (whatsappTab) whatsappTab.close();
            setStatus((result && result.message) || 'Reservasi gagal disimpan. Silakan coba kembali.', 'error');
            return;
          }
          const url='https://wa.me/6285134481399?text='+encodeURIComponent(buildWhatsAppMessage(data));
          setStatus(result.message, 'success');
          if (whatsappTab && !whatsappTab.closed) whatsappTab.location.href=url;
          else window.location.href=url;
        })
        .withFailureHandler(error => {
          submitButton.disabled=false;
          submitButton.textContent='💬 Kirim Pendaftaran';
          if (whatsappTab) whatsappTab.close();
          setStatus('Reservasi belum tersimpan: '+(error && error.message ? error.message : 'terjadi gangguan.'), 'error');
        })
      .submitPublicReservation(data);
      } catch (error) {
        submitButton.disabled=false;
        submitButton.textContent='💬 Kirim Pendaftaran';
        if (whatsappTab) whatsappTab.close();
        setStatus('Gagal menjalankan penyimpanan: '+(error && error.message ? error.message : 'periksa deployment Apps Script.'), 'error');
      }
    }

  </script>
</body>

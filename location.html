<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17100b">
  <title>Ambil Lokasi - Rumah Pijat Boyolali</title>
  <style>
    :root{color-scheme:light;--brown:#17100b;--cream:#fff8ed;--ink:#38291c;--gold:#b8893d;--red:#a52e28;--green:#286343}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;background:var(--brown);font:16px Arial,system-ui,sans-serif;color:var(--ink)}
    main{width:min(100%,430px);padding:26px 22px;background:var(--cream);border-radius:20px;text-align:center;box-shadow:0 10px 30px #0005}
    h1{margin:0;color:#9b6b25;font-size:23px}
    p{line-height:1.55;color:#6b5b4a}
    button{width:100%;min-height:50px;border:0;border-radius:11px;background:var(--gold);color:white;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .14s ease,filter .14s ease}
    button:active{transform:scale(.97);filter:brightness(.9)}
    button:disabled{opacity:.65;cursor:wait}
    #status{min-height:24px;margin:14px 0 0;font-size:14px}
    #status.error{color:var(--red)}#status.success{color:var(--green)}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <main>
    <h1>Bagikan Lokasi</h1>
    <p>Izinkan akses lokasi perangkat. Jika berhasil, tautan Maps akan dikirim kembali ke formulir reservasi.</p>
    <button id="locationButton" type="button" onclick="ambilLokasi()">📍 Ambil Lokasi Saya</button>
    <p id="status" aria-live="polite">Meminta lokasi perangkat…</p>
  </main>
  <script>
    const button=document.getElementById('locationButton');
    const statusBox=document.getElementById('status');
    let sedangMengambil=false;
    let requestId=0;

    function status(message,type){
      statusBox.textContent=message;
      statusBox.className=type||'';
    }

    function ambilLokasi(){
      // If the automatic attempt is waiting for permission, a real button tap
      // restarts the request with a direct user gesture for browser permission.
      if(sedangMengambil){requestId++;sedangMengambil=false;}
      if(!navigator.geolocation){
        status('Browser ini tidak mendukung GPS. Coba buka tautan di Chrome atau Firefox terbaru.','error');
        return;
      }
      sedangMengambil=true;
      const currentRequest=++requestId;
      button.disabled=false;
      button.textContent='📍 Ketuk untuk izinkan / coba lagi';
      status('Pastikan izin lokasi untuk situs ini dipilih “Izinkan”.','');
      window.setTimeout(()=>{
        if(!sedangMengambil||currentRequest!==requestId)return;
        sedangMengambil=false;
        button.disabled=false;
        button.textContent='📍 Coba Lagi';
        status('Permintaan lokasi belum dijawab. Izinkan lokasi di browser, lalu tekan tombol untuk mencoba lagi.','error');
      },22000);
      navigator.geolocation.getCurrentPosition(position=>{
        if(currentRequest!==requestId)return;
        const latitude=position.coords.latitude;
        const longitude=position.coords.longitude;
        const mapsUrl=`https://maps.google.com/?q=${latitude},${longitude}`;
        if(window.opener&&!window.opener.closed){
          window.opener.postMessage({type:'rpb-location-result',latitude,longitude,mapsUrl},'*');
          status('Lokasi berhasil dikirim ke formulir. Anda bisa kembali ke tab reservasi.','success');
        }else{
          status('Lokasi berhasil diambil: '+mapsUrl,'success');
        }
        button.disabled=true;
        button.textContent='✅ Lokasi Berhasil';
      },error=>{
        if(currentRequest!==requestId)return;
        const errors={
          1:'Izin lokasi ditolak. Izinkan lokasi untuk situs ini di pengaturan browser, lalu tekan tombol untuk mencoba lagi.',
          2:'Lokasi belum tersedia. Aktifkan GPS/perizinan lokasi perangkat, lalu coba lagi.',
          3:'Pencarian lokasi terlalu lama. Coba lagi di area terbuka.'
        };
        status(errors[error.code]||'Lokasi gagal diambil. Periksa pengaturan lokasi perangkat lalu coba lagi.','error');
        button.textContent='📍 Coba Lagi';
        button.disabled=false;
        sedangMengambil=false;
      },{enableHighAccuracy:true,timeout:20000,maximumAge:60000});
    }

    status('Mencoba mengambil lokasi. Jika browser menunggu izin, tekan tombol untuk memulai ulang permintaan GPS.','');
    ambilLokasi();
  </script>
</body>
</html>
